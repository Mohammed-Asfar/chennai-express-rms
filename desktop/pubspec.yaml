name: chennai_express_pos
description: Chennai Express RMS - billing counter application
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  window_manager: ^0.4.3
  crypto: ^3.0.7
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.1
  web_socket_channel: ^3.0.3
  file_picker: ^11.0.3
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

# The Windows title bar and taskbar icon. Regenerate with:
#   dart run flutter_launcher_icons
#
# The source is squared and padded because Windows does not letterbox for you —
# feeding it the 783x803 artwork directly would stretch the mark.
flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/logo_square.png"
    # 256 is the largest Windows uses, and what the .ico is built down from.
    icon_size: 256
