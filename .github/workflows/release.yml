# Builds the Windows installer on a tag, and attaches it to a GitHub Release.
#
# WHAT THIS PRODUCES IS NOT SHIPPABLE TO A TILL.
#
# The installer bakes CLOUD_DATABASE_URL in at build time, and this repository is
# public, so no Neon credential is available here. The result is an offline-only
# build: no cloud backup, no auto-update, and — because licences live in the
# cloud — no way past the activation screen.
#
# It exists to prove the whole chain compiles and packages on a clean machine,
# and to archive an artefact per tag. The installer a restaurant actually runs is
# still built locally:
#
#   .\installer\build.ps1
#   cd backend; npm run publish:release -- --file ... --notes "..."
#
# The release notes say the same thing, so an artefact downloaded from the
# Releases page cannot be mistaken for a shippable one.

name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # For testing the workflow itself without burning a version number.
  workflow_dispatch:

# Never cancel a release in progress. A half-uploaded asset is worse than a
# duplicate run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decides whether there is anything to release.
  #
  # A push to main that did not change the version is a doc fix, a test, or a
  # refactor — real work that should not mint a release. Only a version bump
  # does, which makes releasing an explicit act inside an ordinary merge.
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      should_release: ${{ steps.read.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - id: read
        shell: bash
        run: |
          file=backend/src/lib/version.ts

          # sed, not grep -oP. PCRE is a GNU build option and it refuses to run
          # under a non-UTF-8 locale — an empty version would then either abort
          # the run or, without the guard below, try to publish a release called
          # "v".
          version=$(sed -n "s/.*APP_VERSION *= *'\([^']*\)'.*/\1/p" "$file")
          build=$(sed -n 's/.*APP_BUILD_NUMBER *= *\([0-9][0-9]*\).*/\1/p' "$file")

          if [ -z "$version" ] || [ -z "$build" ]; then
            echo "Could not read the version from $file" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build"     >> "$GITHUB_OUTPUT"

          # A tag was pushed deliberately, so it always releases. On main, only
          # a version with no existing release does — pushing twice without a
          # bump would otherwise fail on the second run, or overwrite the first.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no release yet — building."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # Pinned to the SDK the installer is built with locally. A release must not
      # be compiled by whatever version stable happened to move to that morning.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      # The same gate as CI. A tag must not produce an installer whose backend
      # fails its own tests.
      - name: Test backend
        working-directory: backend
        run: pnpm test

      - name: Install desktop dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Test desktop
        working-directory: desktop
        run: flutter test

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # -CloudDatabaseUrl '' is explicit, not a default. build.ps1 falls back to
      # backend\.env, which does not exist here; passing the empty string states
      # the intent and takes the script's documented offline-only path instead of
      # relying on a missing file.
      - name: Build the installer
        shell: pwsh
        run: .\installer\build.ps1 -CloudDatabaseUrl ''

      - name: Checksum
        id: hash
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\chennai-express-setup-*.exe | Select-Object -First 1
          $sha = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          $mb  = [Math]::Round($exe.Length / 1MB, 1)
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sha=$sha"              >> $env:GITHUB_OUTPUT
          "size=$mb"              >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name)  $mb MB  sha256 $sha"

      # Kept for a workflow_dispatch run, which creates no release.
      - uses: actions/upload-artifact@v4
        with:
          name: chennai-express-installer
          path: dist/chennai-express-setup-*.exe
          retention-days: 30

      # workflow_dispatch produces an artefact but no release: it exists to test
      # this workflow, and a test run should not mint a version.
      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # On a main push there is no tag yet, so name it. On a tag push this
          # is the tag that is already there, and naming it again is harmless.
          tag_name: v${{ needs.version.outputs.version }}
          name: Chennai Express ${{ needs.version.outputs.version }}
          files: dist/chennai-express-setup-*.exe
          body: |
            ## ⚠️ Offline-only build — not for a restaurant PC

            This installer was built by CI and carries **no cloud connection
            string**. It cannot back up, cannot auto-update, and **cannot be
            activated**, because licences live in the cloud. It stops at the
            activation screen.

            It is here to show the tag builds and packages cleanly.

            The installer for a till is built locally, where the Neon
            credential lives:

            ```
            .\installer\build.ps1
            cd backend
            npm run publish:release -- --file dist\chennai-express-setup-<version>.exe --notes "..."
            ```

            ---

            **This artefact**
            `${{ steps.hash.outputs.size }} MB`
            `sha256 ${{ steps.hash.outputs.sha }}`

            The SHA-256 is not the one tills verify. That belongs to the
            locally built installer recorded in `app_releases`.
